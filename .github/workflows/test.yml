name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The library github.com/fredericgermain/skyhub is public, so it comes
      # from the Go module proxy like any dependency; the fake-hub tests read
      # its fixtures from that download (see provider_test.go).
      - run: go mod download
      - run: go vet ./...
      - run: go test ./...
      - run: go generate ./... && git diff --exit-code docs/
